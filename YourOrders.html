<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Orders - Haru Bayan</title>
  <link rel="icon" type="image/png" href="../img/mainpics/logo/logo-harubayan.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }

    header {
      background-color: #7f8c8d;
      color: white;
      padding: 10px 0;
      text-align: center;
    }

    header .user-info {
      display: flex;
      justify-content: flex-end;
      padding: 10px 20px;
    }

    header .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f1f1f1;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 1;
      border-radius: 5px;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #ddd;
    }

    .title-section {
      background-color: #9b001e;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .title-section h2 {
      margin: 0;
    }

    #orders-container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .order-card {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .order-card h4 {
      font-size: 18px;
      color: #9b001e;
    }

    .order-card p {
      font-size: 14px;
      color: #555;
      margin: 5px 0;
    }

    .review-receipt-section {
      text-align: center;
      margin: 40px 0;
    }

    footer {
      background-color: #7f8c8d;
      color: white;
      text-align-last: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.4);
      padding-top: 60px;
    }

    .modal-content {
      background-color: #fff;
      margin: 5% auto;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 500px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .modal-header, .modal-footer {
      padding: 10px 0;
    }

    .modal-footer {
      text-align: center;
    }

    .modal-btn {
      padding: 10px 20px;
      background-color: #9b001e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-btn:hover {
      background-color: #7f1a2b;
    }
  </style>
</head>
<body>

  <section class="title-section">
    <h2>Your Orders</h2>
  </section>

  <section id="orders-container">
    <!-- Orders will be dynamically injected here -->
  </section>

  <!-- Review Receipt Button -->
  <section class="review-receipt-section">
    <button id="open-receipt-btn" class="modal-btn">Review Receipt</button>
  </section>

  <!-- Receipt Modal -->
  <div id="receipt-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Your Receipt:</h3>
      </div>
      <div id="receipt-details">
        <!-- Dynamic receipt details will be displayed here -->
      </div>

      <div style="margin: 15px 0;">
        <label for="order-type" style="font-weight: 600;">Order Type:</label>
        <select id="order-type" style="padding: 8px; border-radius: 5px; width: 100%; margin-top: 5px;">
          <option value="dine-in">Dine-In</option>
          <option value="takeout">Takeout</option>
        </select>
      </div>


      <div class="modal-footer">
        <button id="confirm-btn" class="modal-btn">Confirm Order</button>
      </div>
    </div>
  </div>

  <!-- Thank You Modal -->
  <div id="thank-you-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Thank You!</h3>
      </div>
      <div class="modal-footer">
        <button id="close-btn" class="modal-btn">Close</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 Haru Bayan. Created by MyTech Corp.
  </footer>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js";

    const SUPABASE_URL = 'https://lngdoqimxolarajflobo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZ2RvcWlteG9sYXJhamZsb2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ0MjQ5MDQsImV4cCI6MjA2MDAwMDkwNH0.hDroH3E7cq-RHh8iGsbg5s1tdYVSHMI94ZSZXzoABic';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let ordersData = [];

    async function fetchOrders() {
      const loggedInUser = localStorage.getItem('loggedInUser');
      if (!loggedInUser) {
        alert("Please log in to view your orders.");
        return;
      }

      const { data: userData, error: userError } = await supabase
        .from('customers')
        .select('id')
        .eq('username', loggedInUser)
        .single();

      if (userError || !userData) {
        alert("User not found.");
        return;
      }

      const customer_id = userData.id;

      const { data: orders, error: ordersError } = await supabase
        .from('customers_order')
        .select(`
          id,
          menu_item_id,
          quantity,
          total_price,
          order_date,
          status,
          menu_item: menu(id, price, description, recipes(name, image_url))
        `)
        .eq('customer_id', customer_id)
        .eq('status', 'pending');

      if (ordersError) {
        console.error("Error fetching orders:", ordersError);
        return;
      }

      ordersData = orders;

      const container = document.getElementById('orders-container');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = '<p>You have no orders yet.</p>';
        return;
      }

      orders.forEach(order => {
        const card = document.createElement('div');
        card.className = 'order-card';
        const orderDate = new Date(order.order_date).toLocaleString();

        card.innerHTML = `
          <div>
            <h4>Dish: ${order.menu_item.recipes.name}</h4>
            <p>Quantity: ${order.quantity}</p>
            <p>Total Price: ₱${order.total_price.toFixed(2)}</p>
            <p>Order Date: ${orderDate}</p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    fetchOrders();

    document.getElementById('open-receipt-btn').addEventListener('click', () => {
      const receiptDetails = document.getElementById('receipt-details');
      if (ordersData.length === 0) {
        receiptDetails.innerHTML = '<p>No items in your receipt.</p>';
      } else {
        const orderLines = ordersData.map(order => `
          <p>Dish: ${order.menu_item.recipes.name} | Quantity: ${order.quantity} | Total: ₱${order.total_price.toFixed(2)}</p>
        `).join('');

        const grandTotal = ordersData.reduce((sum, order) => sum + order.total_price, 0);

        receiptDetails.innerHTML = `
          ${orderLines}
          <hr />
          <p><strong>Grand Total: ₱${grandTotal.toFixed(2)}</strong></p>
        `;
      }
      document.getElementById('receipt-modal').style.display = 'block';
    });

    document.getElementById('confirm-btn').addEventListener('click', async function () {
  const orderType = document.getElementById('order-type').value;
  document.getElementById('orders-container').innerHTML = '';

  const loggedInUser = localStorage.getItem('loggedInUser');
  if (!loggedInUser) return;

  const { data: userData, error: userError } = await supabase
    .from('customers')
    .select('id')
    .eq('username', loggedInUser)
    .single();

  if (userError || !userData) return;

  const customer_id = userData.id;

  await supabase
    .from('customers_order')
    .update({ order_type: orderType, status: 'confirmed' }) // You can also update status here
    .eq('customer_id', customer_id)
    .eq('status', 'pending');

  document.getElementById('receipt-modal').style.display = 'none';
  document.getElementById('thank-you-modal').style.display = 'block';
});

    document.getElementById('close-btn').addEventListener('click', function () {
      document.getElementById('thank-you-modal').style.display = 'none';
    });
  </script>
</body>
</html>
