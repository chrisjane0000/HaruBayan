<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu - Desserts and Sweets</title>
  <link rel="icon" type="image/png" href="../img/mainpics/logo/logo-harubayan.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    }


    body {
      background: #fff;
      color: #333;
    }

    header.first_head {
      background-color: #9b001e;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    header.first_head nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    header.first_head nav a:hover{
        color: #ffcc00;
    }

    .user-info {
      display: flex;
      align-items: center;
    }

      .user-info {
        position: relative;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      .dropdown {
        position: relative;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #fff;
        min-width: 160px;
        box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
        z-index: 1;
        right: 0;
        border-radius: 5px;
        overflow: hidden;
      }

      .dropdown-content a {
        color: #9b001e;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
      }
    
      .dropdown-content a:hover {
        background-color: #ee8585;
      }
    
      .dropdown:hover .dropdown-content {
        display: block;
      }

    .title-section h2 {
        margin-top: 2%;
    text-align: center;
      font-size: 3rem; 
      font-weight: bold; 
      color: #6d0000; 
      background: linear-gradient(45deg, #8b0013, #d39379); 
      -webkit-background-clip: text; 
      background-clip: text;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); 
      letter-spacing: 2px;
      margin-bottom: -2%;
    }

    .title-section p{
    text-align: center;
      font-size: 1.5rem;
      color: #333;
      font-weight: 400;
      margin-bottom: 1%;
      font-style: italic;
      margin-top: 1%;
    }

    .menu-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
      flex: 1;
     }


    .menu-card {
      width: 280px;
      border: 1px solid #751d2e;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.30);
      overflow: hidden;
      text-align: center;
      background-color: white;
      transition: transform 0.3s, box-shadow 0.3s;
      height: 100%;
    }

    .menu-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .menu-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .menu-card h4 {
      color: #9b001e;
      margin: 0.5rem 0 0.2rem;
      font-size: 20px;
    }

    .menu-card p {
      font-size: 0.9rem;
      color: #111111;
    }

    .menu-card button {
      margin: 0.8rem 0 1rem;
      padding: 6px 10px;
      background-color: #9b001e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .menu-card button:hover {
      background-color: #750019;
    }

    footer {
      background-color: #9b001e;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 1%;
    }

    .back-button {
    position: fixed;
      top: 15%;
      left: 2rem;
      background-color: #9b001e;
      color: white;
     
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
      z-index: 1000; /* Ensure it's above other content */
    }

    .back-button a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #9b001e;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .back-button a:hover {
      background-color: #751d2e;
    }
  </style>
</head>
<body>

  <header class="first_head">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="../img/mainpics/logo/logo-harubayan.png" alt="Haru Bayan Logo" style="height: 35px; width: 35px; border-radius: 50%;">
      <strong>Haru Bayan</strong>
    </div>
    <nav>
      <a href="../haruBayan.html">HOME</a>
      <a href="../Menu-categories.html">MENU</a>
      <a href="../Services.html">SERVICE</a>
      <a href="../Contact.html">CONTACT</a>
    </nav>
    <div class="user-info">
      <div class="dropdown">
        <i class="fas fa-user-circle" style="font-size: 2rem; color: #fce4ec;"></i>
        <span style="margin-left: 0.5rem; color: white;" id="dropdown-username">Guest</span>
        <i class="fas fa-chevron-down" style="color: white; margin-left: 0.5rem;"></i>
        <div class="dropdown-content">
          <a href="#" id="login-btn">Login</a>
          <a href="#" id="signup-btn">Signup</a>
          <a href="#" id="orders-link" style="display:none;">Your Orders</a>
          <a href="#" id="logout-link" style="display:none;">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <section class="title-section">
    <h2>DESSERTS & SWEETS</h2>
    <p>MENUS</p>
  </section>

  <section class="menu-grid" id="menu-container">
    <!-- Menu items will be dynamically injected here -->
  </section>

  <div class="back-button">
    <a href="../Menu-categories.html">&larr; Back to Menu Categories</a>
  </div>

  <footer>
    &copy; 2025 Haru Bayan. Created by MyTech Corp.
  </footer>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js";

    const SUPABASE_URL = 'https://lngdoqimxolarajflobo.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuZ2RvcWlteG9sYXJhamZsb2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ0MjQ5MDQsImV4cCI6MjA2MDAwMDkwNH0.hDroH3E7cq-RHh8iGsbg5s1tdYVSHMI94ZSZXzoABic';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchMenu() {
    const { data, error } = await supabase
      .from("menu")
      .select(`
        id,
        price,
        description,
        available,
        recipes (
          name,
          category,
          image_url
        )
      `)
      .eq('recipes.category', 'Desserts & Sweets'); 

    if (error) {
      console.error("Error fetching menu:", error);
      return;
    }

    const container = document.getElementById("menu-container");
    container.innerHTML = "";  // Clear any previous content

    data.forEach(item => {
      if (item.recipes) {  // Check if recipes is not null or undefined
        const card = document.createElement("div");
        card.className = "menu-card";

        // Fallback to a default image if no image_url is available
        const imageUrl = item.recipes.image_url || '../img/default-image.jpg'; // Add your fallback image path here

        // Set the available/unavailable class based on the "available" value
        const availabilityClass = item.available ? 'available' : 'unavailable';
        const availabilityColor = item.available ? 'green' : 'red';

        card.innerHTML = `
          <img src="${imageUrl}" alt="${item.recipes.name}" />
          <h4>${item.recipes.name}</h4>
          <p style = "font-weight: bold;">₱${parseFloat(item.price).toFixed(2)}</p>
          <p style="font-size: 0.85rem; color: #555; margin: 5px 10px;">${item.description}</p>
          <p class="menu-availability" style="color: ${availabilityColor}; font-weight: bold;">${item.available ? 'AVAILABLE' : 'UNAVAILABLE'}</p>
          <button class="order-btn">Add to Order</button>
        `;

        container.appendChild(card);
      } else {
        console.error("Missing recipes data for menu item:", item);
      }
    });
  }

  fetchMenu();

  const loggedInUser = localStorage.getItem('loggedInUser');
  if (loggedInUser) {
    document.getElementById('dropdown-username').textContent = loggedInUser;
    document.getElementById('login-btn').style.display = 'none';
    document.getElementById('signup-btn').style.display = 'none';
    document.getElementById('orders-link').style.display = 'block';
    document.getElementById('logout-link').style.display = 'block';
  }

  document.getElementById('logout-link').addEventListener('click', function() {
    localStorage.removeItem('loggedInUser');
    window.location.reload();
  });

let currentSlide = 0;
const slides = document.querySelectorAll(".slide");
const indicators = document.querySelectorAll(".indicator");

function showSlide(index) {
  slides.forEach((slide, i) => {
    slide.classList.remove("active");
    if (indicators[i]) indicators[i].classList.remove("active");
  });
  slides[index].classList.add("active");
  if (indicators[index]) indicators[index].classList.add("active");
  currentSlide = index;
}

function nextSlide() {
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
}

setInterval(nextSlide, 3000);

// MODALS (Login and Signup)
const loginModal = document.getElementById("login-modal");
const signupModal = document.getElementById("signup-modal");
const loginBtn = document.getElementById("login-btn");
const signupBtn = document.getElementById("signup-btn");
const closeLogin = document.getElementById("close-login");
const closeSignup = document.getElementById("close-signup");

loginBtn.addEventListener("click", () => loginModal.style.display = "block");
signupBtn.addEventListener("click", () => signupModal.style.display = "block");

closeLogin.addEventListener("click", () => loginModal.style.display = "none");
closeSignup.addEventListener("click", () => signupModal.style.display = "none");

window.addEventListener("click", (event) => {
  if (event.target == loginModal) loginModal.style.display = "none";
  if (event.target == signupModal) signupModal.style.display = "none";
});
  </script>

</body>
</html>
