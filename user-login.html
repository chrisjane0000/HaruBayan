<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HaruBayan - User Login</title>
  <link rel="icon" type="image/png" href="img/logo-harubayan.png"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #8b0013;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box h2 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-card {
      background-color: #f3e6f3;
      padding: 30px 20px;
      border-radius: 15px;
      width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card input {
      width: 300px;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #570404;
      border-radius: 10px;
      background-color: #f1cece;
    }

    .logo {
      width: 80px;
      margin: 20px 0 10px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .login-card button {
      background-color: #ff7070;
      color: white;
      border: none;
      padding: 10px;
      width: 200px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }

    .login-card button:hover {
      background-color: #e05555;
    }

    .notification {
      display: none;
      color: white;
      padding: 15px;
      position: fixed;
      top: 20px;
      right: 20px;
      border-radius: 5px;
      font-size: 16px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .notification.success {
      background-color: #ff69b4;
    }

    .notification.error {
      background-color: #e74c3c;
    }

    .notification.show {
      display: block;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>USER LOGIN</h2>
    <div class="login-card">
        <img src="img/logo-harubayan.png" alt="Logo" class="logo" />
        <h3 class="brand">Haru-Bayan</h3>

        <input type="text" placeholder="Username" class="username" />
        <input type="password" placeholder="Password" class="password" />
        <button>LOGIN</button>

        <div id="login-notification" class="notification">
          Login successful! Welcome <span id="user-name"></span>.
        </div>
    </div>
  </div>

  <script>
    const loginBtn = document.querySelector('button');
    const usernameInput = document.querySelector('.username');
    const passwordInput = document.querySelector('.password');
  
    loginBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
  
      if (!username || !password) {
        displayNotification('Please fill in both fields!', 'error');
        return;
      }
  
      // Simulate login success without checking against database
      const dummyUser = { username };
      localStorage.setItem('loggedInUser', JSON.stringify(dummyUser));
      displayNotification(`Login successful! Welcome ${username}.`, 'success');
  
      setTimeout(() => {
        window.location.href = '../Menu-categories.html';
      }, 2000);
    });
  
    function displayNotification(message, type) {
      const notification = document.getElementById('login-notification');
      notification.textContent = message;
      notification.classList.remove('success', 'error');
      notification.classList.add(type);
      notification.classList.add('show');
  
      setTimeout(() => {
        notification.classList.remove('show');
      }, 5000);
    }
  </script>
  
</body>
</html>
