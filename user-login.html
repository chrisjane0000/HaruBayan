<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HaruBayan - User Login</title>
  <link rel="icon" type="image/png" href="img/logo-harubayan.png"/>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #8b0013;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-box h2 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-card {
      background-color: #f3e6f3;
      padding: 30px 20px;
      border-radius: 15px;
      width: 180%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .login-card input {
      width: 80%;
      max-width: 300px;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #570404;
      border-radius: 10px;
      background-color: #f1cece;
    }

    .logo {
      width: 80px;
      margin: 20px 0 10px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .login-card button {
      background-color: #ff7070;
      color: white;
      border: none;
      padding: 10px;
      width: 200px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }

    .login-card button:hover {
      background-color: #e05555;
    }

    .notification {
      display: none;
      color: white;
      padding: 15px;
      position: fixed;
      top: 30px;
     font-family: 'Courier New', Courier, monospace;
      border-radius: 5px;
      font-size: 20px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      text-align: center;
      font-weight: bold;
    }

    .notification.show {
      display: block;
      opacity: 1;
    }

    .signup-link {
      margin-top: 10px;
      font-size: 14px;
    }

    .signup-link a {
      color: #570404;
      text-decoration: none;
      font-weight: bold;
    }

    .signup-link a:hover {
      color: #ff7070;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>USER LOGIN</h2>
    <div class="login-card">
        <img src="img/logo-harubayan.png" alt="Logo" class="logo" />
        <h3 class="brand">Haru-Bayan</h3>

        <form id="login-form">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">LOGIN</button>
        </form>

        <div class="signup-link">
          <span>Don't have an account? <a href="./user-signup.html">Sign up</a></span>
        </div>

        <div id="login-notification" class="notification success">
          Login successful! Welcome <span id="user-name"></span>.
        </div>

        <div id="login-error-notification" class="notification error">
          Invalid username or password.
        </div>
    </div>
  </div>

  <script>
    const form = document.querySelector('#login-form');
    const notification = document.querySelector('#login-notification');
    const errorNotification = document.querySelector('#login-error-notification');
    const userNameSpan = document.querySelector('#user-name');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.querySelector('input[name="username"]').value;
      const password = document.querySelector('input[name="password"]').value;

      if (!username || !password) {
        alert("Please fill in both fields!");
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/login/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('loggedInUser', username);
          userNameSpan.textContent = username;
          notification.classList.add('show');

          setTimeout(() => {
            notification.classList.remove('show');
            window.location.href = 'Menu-categories.html';
          }, 3000);
        } else {
          errorNotification.classList.add('show');
          setTimeout(() => {
            errorNotification.classList.remove('show');
          }, 3000);
        }
      } catch (error) {
        console.error('Error:', error);
        alert('There was an error logging in.');
      }
    });
  </script>
</body>
</html>
